<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Решение: форма входа</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #e0e7ff 0%, #f8fafc 50%, #ede9fe 100%);
      color: #1e293b;
    }

    .login {
      width: 100%;
      max-width: 22rem;
      padding: 1.75rem 1.5rem 1.5rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    .login__title {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }

    .login__subtitle {
      margin: 0 0 1.5rem;
      font-size: 0.875rem;
      text-align: center;
      color: #64748b;
    }

    .login__field {
      margin-bottom: 1rem;
    }

    .login__label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #475569;
    }

    .login__input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .login__input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .login__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      font-size: 0.8125rem;
    }

    .login__remember {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #475569;
      cursor: pointer;
    }

    .login__link {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .login__link:hover {
      text-decoration: underline;
    }

    .login__submit {
      display: block;
      width: 100%;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .login__submit:hover {
      background: #4338ca;
    }

    .login__submit:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <form class="login" action="#" method="post">
    <h1 class="login__title">Вход</h1>
    <p class="login__subtitle">Добро пожаловать обратно</p>

    <div class="login__field">
      <label class="login__label" for="email">Эл. почта</label>
      <input class="login__input" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="username">
    </div>

    <div class="login__field">
      <label class="login__label" for="password">Пароль</label>
      <input class="login__input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="login__row">
      <label class="login__remember">
        <input type="checkbox" name="remember">
        Запомнить меня
      </label>
      <a class="login__link" href="#">Забыли пароль?</a>
    </div>

    <button class="login__submit" type="submit">Войти</button>
  </form>
</body>
</html>
