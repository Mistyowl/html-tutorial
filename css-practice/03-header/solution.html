<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Решение: шапка маркетплейса</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .site-header {
      background: #005bff;
      color: #fff;
      padding: 0.75rem 1rem;
    }

    .site-header__inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      max-width: 72rem;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
      flex-shrink: 0;
    }

    .catalog-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.9rem;
      border: none;
      border-radius: 8px;
      background: #0047cc;
      color: #fff;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .catalog-btn:hover {
      background: #003aa8;
    }

    .search {
      display: flex;
      flex: 1;
      min-width: 12rem;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .search__input {
      flex: 1;
      min-width: 0;
      padding: 0.65rem 0.85rem;
      border: none;
      font-family: inherit;
      font-size: 0.9375rem;
    }

    .search__input:focus {
      outline: none;
      box-shadow: inset 0 0 0 2px #005bff;
    }

    .search__btn {
      padding: 0 1rem;
      border: none;
      background: #f91155;
      color: #fff;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search__btn:hover {
      background: #d60f48;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem 1rem;
      flex-shrink: 0;
      margin-left: auto;
    }

    .nav-actions a {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.95;
    }

    .nav-actions a:hover {
      opacity: 1;
    }

    .nav-actions__icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .nav-actions__badge {
      position: absolute;
      top: -0.2rem;
      right: 0.1rem;
      min-width: 1.1rem;
      height: 1.1rem;
      padding: 0 0.25rem;
      border-radius: 999px;
      background: #f91155;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1.1rem;
      text-align: center;
    }

    .demo-page {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      color: #64748b;
      font-size: 0.9375rem;
    }

    @media (max-width: 720px) {
      .search {
        order: 3;
        flex: 1 1 100%;
      }

      .nav-actions {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="#">ShopRu</a>
      <button type="button" class="catalog-btn">☰ Каталог</button>
      <form class="search" action="#" role="search">
        <input class="search__input" type="search" placeholder="Искать на ShopRu" aria-label="Поиск">
        <button class="search__btn" type="submit">Найти</button>
      </form>
      <nav class="nav-actions" aria-label="Личный кабинет">
        <a href="#">
          <span class="nav-actions__icon" aria-hidden="true">📦</span>
          Заказы
        </a>
        <a href="#">
          <span class="nav-actions__icon" aria-hidden="true">♡</span>
          Избранное
        </a>
        <a href="#">
          <span class="nav-actions__badge">2</span>
          <span class="nav-actions__icon" aria-hidden="true">🛒</span>
          Корзина
        </a>
      </nav>
    </div>
  </header>
  <main class="demo-page">
    <p>Под шапкой — обычное содержимое страницы. Сузь окно: поиск перейдёт на отдельную строку.</p>
  </main>
</body>
</html>
